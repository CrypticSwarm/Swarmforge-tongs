# Example definition; not auto-discovered. To enable it:
#   1. make image TONG=git-signing   # or pull crypticswarm/git-signing-tong by digest (see README)
#   2. cp git-signing/git-signing.tong.yaml ~/.swarmforge/tongs/git-signing.yaml
#   3. edit the copy's ${secret:...} PLACEHOLDERS: REPLACE-ME will not resolve, and op is a provider from ~/.swarmforge/secret-providers.yaml
description: Signs the workspace's unpublished commits with a GPG key the agent never holds.
lifecycle: session
image: swarmforge-tong-git-signing:latest
env:
  # gpg --armor --export-secret-keys <fingerprint>
  GIT_SIGNING_KEY: ${secret:op:op://REPLACE-ME/git-signing/private-key}
  # Delete this line if your key has no passphrase; an unresolvable reference stops the launch.
  GIT_SIGNING_KEY_PASSPHRASE: ${secret:op:op://REPLACE-ME/git-signing/passphrase}
# Required with secret env: the image's CMD is not used.
command: ["/app/entrypoint.sh"]
interface:
  kind: mcp
  transport: http
  port: 8080
  name: git-signing
mounts:
  # rw: signing writes commit objects and moves the branch ref; the working tree is untouched.
  - workspace:rw
readiness:
  mode: tcp
