# Example definition; not auto-discovered. To enable it:
#   1. make image TONG=github   # or pull crypticswarm/github-tong by digest (see README)
#   2. cp github/github.tong.yaml ~/.swarmforge/tongs/github.yaml
#   3. edit the copy's ${secret:...} PLACEHOLDER: REPLACE-ME will not resolve, and op is a provider from ~/.swarmforge/secret-providers.yaml
description: Fetches and pushes branches, manages pull requests, reads Actions CI, and dispatches allowlisted workflows for the workspace's repository, with a token the agent never holds.
lifecycle: session
image: swarmforge-tong-github:latest
env:
  # Fine-grained PAT for the served repositories: Contents rw, Pull requests rw,
  # Actions read (rw with GITHUB_TONG_DISPATCH).
  GITHUB_TOKEN: ${secret:op:op://REPLACE-ME/github-tong/token}
  # "true" refuses pushing unsigned commits. Only "true" and "false"; anything else stops startup.
  GITHUB_TONG_REQUIRE_SIGNED_COMMITS: "false"
  # "true" serves the verbs in .github/swarmforge-dispatch.yml on the default branch. Same values.
  GITHUB_TONG_DISPATCH: "false"
# Required with secret env: the image's CMD is not used.
command: ["/app/entrypoint.sh"]
interface:
  kind: mcp
  transport: http
  port: 8080
  name: github
mounts:
  # rw: push and fetch write refs and objects under .git; working tree untouched.
  - workspace:rw
readiness:
  mode: tcp
