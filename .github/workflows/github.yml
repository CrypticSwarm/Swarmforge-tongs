name: github

on:
  push:
    branches: [master]
    paths:
      - github/**
      - .github/workflows/github.yml
  pull_request:
    paths:
      - github/**
      - .github/workflows/github.yml

permissions:
  contents: read

concurrency:
  group: github-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, with the release it was taken
# from in a trailing comment: a tag can be moved to new code, a SHA cannot.
# Dependabot proposes the bumps (.github/dependabot.yml).
jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Tracks the Dockerfile's node:24-alpine.
          node-version: '24'
          cache: npm
          cache-dependency-path: github/package-lock.json

      - run: make -C github test

  publish:
    # Only a push to master publishes, and only after the suite passes. The
    # paths filter above already limits that to changes touching this tong, so
    # a merge that leaves it alone pushes nothing.
    name: publish to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    # Holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Restricting the environment's
    # deployment branches to master keeps the push token away from workflows
    # running on any other branch, including a PR branch that edits this file.
    environment: docker-hub
    env:
      REPO: crypticswarm/github-tong
    steps:
      # Nothing here pushes to git, so the job token is not left in .git/config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The arm64 runtime stage is built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves; the sha tag names exactly which commit an image is.
      - run: make -C github publish REPO="$REPO" TAGS="latest sha-${GITHUB_SHA::12}"

      # The digest is what a tong definition should pin, so surface it.
      - name: Record the digest
        run: |
          digest=$(docker buildx imagetools inspect "$REPO:sha-${GITHUB_SHA::12}" --format '{{.Manifest.Digest}}')
          echo "Published \`$REPO@$digest\`" >> "$GITHUB_STEP_SUMMARY"
