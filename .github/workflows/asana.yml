name: asana

on:
  push:
    branches: [master]
    paths:
      - asana/**
      - .github/workflows/asana.yml
  pull_request:
    paths:
      - asana/**
      - .github/workflows/asana.yml

permissions:
  contents: read

concurrency:
  group: asana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: asana/package-lock.json

      - run: make -C asana test
