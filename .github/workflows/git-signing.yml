name: git-signing

# One workflow per tong, scoped by path: a tong is standalone, so a change to
# one never has to run another's suite. Lifting this tong into its own repo
# takes this file with it unchanged apart from the paths filter.
on:
  push:
    branches: [master]
    paths:
      - git-signing/**
      - .github/workflows/git-signing.yml
  pull_request:
    paths:
      - git-signing/**
      - .github/workflows/git-signing.yml

permissions:
  contents: read

concurrency:
  group: git-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both suites are separate jobs so a failure names itself: `test` is the
    # no-docker, no-gpg, no-key suite, `test-e2e` is the one that needs real
    # `git` and `gpg` on PATH. Both are preinstalled on ubuntu-latest.
    name: make ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-e2e]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Tracks the Dockerfile's NODE_TAG, so CI runs the runtime the image
          # ships.
          node-version: '24'
          cache: npm
          cache-dependency-path: git-signing/package-lock.json

      # Via the tong's own Makefile, which is the contract the root recurses
      # through — CI learns no more about the build than `make` already knows.
      - run: make -C git-signing ${{ matrix.target }}

  publish:
    # Only a push to master publishes, and only after the suite passes. The
    # paths filter above already limits that to changes touching this tong, so
    # a merge that leaves it alone pushes nothing.
    name: publish to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    # Holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Restricting the environment's
    # deployment branches to master keeps the push token away from workflows
    # running on any other branch, including a PR branch that edits this file.
    environment: docker-hub
    env:
      REPO: crypticswarm/git-signing-tong
    steps:
      - uses: actions/checkout@v5

      # arm64 is built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves; the sha tag names exactly which commit an image is.
      - run: make -C git-signing publish REPO="$REPO" TAGS="latest sha-${GITHUB_SHA::12}"

      # The digest is what a tong definition should pin, so surface it.
      - name: Record the digest
        run: |
          digest=$(docker buildx imagetools inspect "$REPO:sha-${GITHUB_SHA::12}" --format '{{.Manifest.Digest}}')
          echo "Published \`$REPO@$digest\`" >> "$GITHUB_STEP_SUMMARY"
