# One `docker` and one `npm` entry per tong, scoped to its directory, so a lifted-out tong takes its entry along.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors stay out of the group: they can change an action's inputs.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /github
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /git-signing
    schedule:
      interval: weekly

  # Majors stay out of the group: they can change an API the tong uses.
  - package-ecosystem: npm
    directory: /github
    schedule:
      interval: weekly
    groups:
      github-npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /git-signing
    schedule:
      interval: weekly
    groups:
      git-signing-npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /asana
    schedule:
      interval: weekly
    groups:
      asana-npm:
        patterns: ["*"]
        update-types: [minor, patch]
