# One `docker` entry per tong, scoped to its directory, so a lifted-out tong takes its entry along.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors stay out of the group: they can change an action's inputs.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /github
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /git-signing
    schedule:
      interval: weekly
